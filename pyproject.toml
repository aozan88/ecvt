[project]
name = "ecvt"
version = "0.1.0"
description = "AI Quality Engineering Platform — multi-agent edge-case validation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "examples/wallet-api"]
