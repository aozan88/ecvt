[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecvt"
version = "1.0.0"
description = "AI Quality Engineering Platform — multi-agent edge-case validation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# `pip install -e .` declared nothing, so it produced an environment with the
# console script and none of the libraries behind it. A Codespace installed
# that way ran the gate's pytest with pytest-asyncio absent: 44 errors and
# three failures, all of them async tests that never got to run.
dependencies = [
  "anthropic>=2",
  "claude-agent-sdk==0.2.187",  # subagent tool is "Agent" (older SDKs: "Task")
  "jsonschema",
  "httpx",
  "mcp>=2.3,<3",  # ecvt-eval server and a06's client (M3-T3); 2.x API: MCPServer, Client
  "pydantic>=2",
  "python-dotenv",
  "pyyaml",
]

[project.optional-dependencies]
# fastapi and uvicorn belong here, not above: they serve the demo target and
# the fixtures that exercise it, never ECVT itself.
dev = [
  "fastapi",
  "uvicorn[standard]",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[project.scripts]
ecvt = "ecvt.cli:main"

# The repo is a flat layout with several non-package top-level directories
# (gates/, config/, landing/, setup/, docs/), so setuptools refuses to guess
# what to install. These say exactly what ships.
[tool.setuptools.packages.find]
include = ["ecvt*", "agents*", "plugins*"]

# Agents read their own prompts at runtime (`load_system_prompt()`), so the
# markdown and schema files travel with the code, not just the .py files.
[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.jsonl", "*.yaml", "*.yml", "*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "examples/wallet-api"]
